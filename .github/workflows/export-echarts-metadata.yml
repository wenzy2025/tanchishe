name: Export ECharts Metadata

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          categories = [
              'line','bar','pie','scatter','map','candlestick','radar','boxplot','heatmap','graph',
              'lines','tree','treemap','sunburst','parallel','sankey','funnel','gauge','pictorialBar',
              'themeRiver','calendar','matrix','chord','custom','dataset','dataZoom','graphic','rich',
              'globe','bar3D','scatter3D','surface','map3D','lines3D','line3D','scatterGL','linesGL',
              'flowGL','graphGL'
          ]
          black = {
              'lines-airline','scatter-world-population','geo3d','geo3d-with-different-height',
              'globe-country-carousel','globe-with-echarts-surface','map3d-alcohol-consumption',
              'map3d-wood-map','scattergl-weibo','heatmap-bmap','effectScatter-bmap','lines-bmap',
              'lines-bmap-bus','lines-bmap-effect','map-bin','global-wind-visualization',
              'global-wind-visualization-2'
          }
          def load(name):
              url=f'https://raw.githubusercontent.com/apache/echarts-examples/master/src/data/{name}'
              text=urllib.request.urlopen(url,timeout=60).read().decode('utf-8')
              body=text[text.index('export default')+len('export default'):].strip()
              if body.endswith(';'): body=body[:-1]
              return json.loads(body)
          regular=load('chart-list-data.js')
          gl=load('chart-list-data-gl.js')
          reg=[]
          for e in regular:
              cats=[c for c in e.get('category',[]) if c in categories]
              if not cats or e.get('noExplore') or e.get('id') in black: continue
              x=dict(e); x['_cats']=cats; reg.append(x)
          gl_keep=[]
          for e in gl:
              cats=[c for c in e.get('category',[]) if c in categories]
              if not cats: continue
              x=dict(e); x['_cats']=cats; gl_keep.append(x)
          combined=reg+gl_keep
          payload={
              'regular':{'unique':len(reg),'memberships':sum(len(x['_cats']) for x in reg),'category_counts':{c:sum(c in x['_cats'] for x in reg) for c in categories}},
              'gl':{'unique':len(gl_keep),'memberships':sum(len(x['_cats']) for x in gl_keep),'category_counts':{c:sum(c in x['_cats'] for x in gl_keep) for c in categories}},
              'combined':{'unique':len(combined),'memberships':sum(len(x['_cats']) for x in combined),'category_counts':{c:sum(c in x['_cats'] for x in combined) for c in categories}},
              'examples':combined
          }
          Path('echarts-metadata.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k!='examples'},ensure_ascii=False))
          PY
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: echarts-metadata-with-gl
          path: echarts-metadata.json
          if-no-files-found: error
          retention-days: 1
